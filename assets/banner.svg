<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Hi, I'm Akin — I build AI agents and ship products fast. Lagos, Nigeria.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030617"/>
      <stop offset="1" stop-color="#121826"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#CA3A32" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#CA3A32" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#212936" stroke-width="1"/>
    </pattern>
    <style>
      .serif { font-family: 'Fraunces', Georgia, 'Times New Roman', serif; }
      .sans  { font-family: 'Instrument Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- status pill -->
  <g transform="translate(64 52)">
    <rect width="262" height="32" rx="16" fill="#121826" stroke="#212936"/>
    <circle class="pulse" cx="20" cy="16" r="5" fill="#3FB950"/>
    <text x="34" y="21" class="sans" font-size="14" fill="#C9CDD6">Open to projects — Q4 2026</text>
  </g>

  <text x="64" y="150" class="serif" font-size="58" font-weight="600" fill="#F9FAFC">Hi, I'm Akin.</text>
  <text x="64" y="200" class="sans" font-size="26" fill="#C9CDD6">I build <tspan fill="#CA3A32" font-weight="700">AI agents</tspan> and ship products fast.</text>
  <text x="64" y="262" class="sans" font-size="17" fill="#8B92A0">Founder, FlagIQ  ·  Lead instructor, Flag Skool  ·  EEE, UNILAG  ·  Lagos, Nigeria</text>

  <!-- proof stats -->
  <g transform="translate(900 92)">
    <rect width="236" height="64" rx="12" fill="#121826" stroke="#212936"/>
    <rect width="4" height="64" rx="2" fill="#CA3A32"/>
    <text x="22" y="34" class="serif" font-size="26" font-weight="600" fill="#F9FAFC">750+</text>
    <text x="22" y="52" class="sans" font-size="13" fill="#8B92A0">students trained in AI</text>
  </g>
  <g transform="translate(900 172)">
    <rect width="236" height="64" rx="12" fill="#121826" stroke="#212936"/>
    <rect width="4" height="64" rx="2" fill="#CA3A32"/>
    <text x="22" y="34" class="serif" font-size="26" font-weight="600" fill="#F9FAFC">900K+</text>
    <text x="22" y="52" class="sans" font-size="13" fill="#8B92A0">impressions teaching AI on X</text>
  </g>
</svg>
