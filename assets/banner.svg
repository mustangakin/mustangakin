<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Mustang — I build AI agents and ship products fast. Lagos, Nigeria.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030617"/>
      <stop offset="1" stop-color="#121826"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#CA3A32" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#CA3A32" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#212936" stroke-width="1"/>
    </pattern>
    <style>
      .serif { font-family: 'Fraunces', Georgia, 'Times New Roman', serif; }
      .sans  { font-family: 'Instrument Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono  { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .wave { animation: wave 3s ease-in-out infinite; transform-origin: 1012px 92px; }
      @keyframes wave { 0%,100% { transform: skewY(0deg); } 50% { transform: skewY(-4deg); } }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- flag mark -->
  <g>
    <rect x="1006" y="70" width="6" height="190" rx="3" fill="#C9CDD6"/>
    <path class="wave" d="M1012 76 C1050 62 1080 96 1124 80 L1124 148 C1080 164 1050 130 1012 144 Z" fill="#CA3A32"/>
  </g>

  <!-- status pill -->
  <g transform="translate(64 52)">
    <rect width="262" height="32" rx="16" fill="#121826" stroke="#212936"/>
    <circle class="pulse" cx="20" cy="16" r="5" fill="#3FB950"/>
    <text x="34" y="21" class="sans" font-size="14" fill="#C9CDD6">Open to projects — Q4 2026</text>
  </g>

  <text x="64" y="150" class="serif" font-size="58" font-weight="600" fill="#F9FAFC">Hi, I'm Mustang.</text>
  <text x="64" y="200" class="sans" font-size="26" fill="#C9CDD6">I build <tspan fill="#CA3A32" font-weight="700">AI agents</tspan> and ship products fast.</text>

  <text x="64" y="262" class="mono" font-size="16" fill="#8B92A0">$ founder @FlagIQ · teacher @FlagSkool · EEE @UNILAG · Lagos, NG<tspan class="cursor" fill="#CA3A32"> ▍</tspan></text>
</svg>
